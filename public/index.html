<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUPRA – Find Your Insights Blind Spot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #7AFF00;
      --bg: #0e0e0e;
      --surface: #181818;
      --surface2: #222222;
      --border: #2e2e2e;
      --text: #f0f0f0;
      --muted: #888;
      --danger: #ff4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ───────────────────────────────────────────────────────── */
    header {
      padding: 20px 32px;
      display: flex;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-img {
      height: 32px;
      width: auto;
      display: block;
    }

    /* ── Hero ─────────────────────────────────────────────────────────── */
    .hero {
      padding: 56px 24px 48px;
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 20px;
    }

    .hero p {
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      font-weight: 400;
      color: #b0b0b0;
      line-height: 1.7;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── Chat wrapper ─────────────────────────────────────────────────── */
    .chat-wrapper {
      max-width: 700px;
      margin: 0 auto 80px;
      padding: 0 16px;
    }

    .chat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    /* ── Messages ─────────────────────────────────────────────────────── */
    #messages {
      padding: 24px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 200px;
      max-height: 520px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-wrap;
      font-weight: 400;
    }

    .bubble.ai {
      background: var(--surface2);
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      background: var(--green);
      color: #0e0e0e;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      font-weight: 600;
    }

    /* ── Typing indicator ─────────────────────────────────────────────── */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 16px;
      background: var(--surface2);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
      width: fit-content;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* ── Score card ───────────────────────────────────────────────────── */
    .score-card {
      align-self: flex-start;
      max-width: 90%;
      background: var(--surface2);
      border: 2px solid var(--green);
      border-radius: 14px;
      padding: 20px 24px;
    }

    .score-card .score-num {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--green);
    }

    .score-card .score-label {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Inline forms ─────────────────────────────────────────────────── */
    .inline-form {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      align-self: flex-start;
      max-width: 90%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .inline-form input[type="text"],
    .inline-form input[type="email"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: 'Montserrat', sans-serif;
      outline: none;
      transition: border-color 0.15s;
      background: var(--surface);
      color: var(--text);
    }

    .inline-form input::placeholder { color: var(--muted); }
    .inline-form input:focus { border-color: var(--green); }

    .inline-form button {
      padding: 10px 20px;
      background: var(--green);
      color: #0e0e0e;
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: opacity 0.15s;
      align-self: flex-start;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .inline-form button:hover { opacity: 0.85; }

    .inline-form .skip-link {
      font-size: 0.78rem;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
      align-self: flex-start;
      font-weight: 500;
    }

    .inline-form .skip-link:hover { color: #bbb; }

    /* ── Input bar ────────────────────────────────────────────────────── */
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-bar textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-family: 'Montserrat', sans-serif;
      line-height: 1.4;
      max-height: 120px;
      outline: none;
      transition: border-color 0.15s;
      background: var(--surface2);
      color: var(--text);
    }

    .input-bar textarea::placeholder { color: var(--muted); }
    .input-bar textarea:focus { border-color: var(--green); }
    .input-bar textarea:disabled { opacity: 0.4; cursor: default; }

    .input-bar button {
      padding: 0 20px;
      background: var(--green);
      color: #0e0e0e;
      border: none;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
      cursor: pointer;
      transition: opacity 0.15s;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .input-bar button:hover:not(:disabled) { opacity: 0.85; }
    .input-bar button:disabled { opacity: 0.3; cursor: default; }

    /* ── Spinner overlay ──────────────────────────────────────────────── */
    .spinner-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(14,14,14,0.82);
      border-radius: 16px;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      z-index: 10;
    }

    .spinner-overlay.active { display: flex; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a class="logo" href="https://www.supra.consulting" target="_blank" rel="noopener">
      <img src="/supra_logo_white.png" alt="SUPRA" class="logo-img" />
    </a>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1>Find Your Insights Blind Spot.</h1>
    <p>Talk to our AI and get an instant assessment. We are happy to send you a detailed assessment including the slides of our IIEX presentation via email.</p>
  </section>

  <!-- Chat -->
  <div class="chat-wrapper">
    <div class="chat-box">
      <div id="messages"></div>
      <div class="input-bar">
        <textarea id="input" rows="1" placeholder="Your answer …"></textarea>
        <button id="sendBtn" onclick="send()">Send</button>
      </div>
      <div class="spinner-overlay" id="spinner">
        <div class="spinner"></div>
        <span>Creating your assessment …</span>
      </div>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    let phase = 1;            // 1=questions, 2=identity, 3=generating, 4=email, 5=done
    let questionIndex = 0;    // 0-based; increments AFTER each user answer; at 3 → phase 2
    let conversationHistory = [];
    const answers = [];       // [answer_1, answer_2, answer_3]
    const leadData = {
      name: '', company: '', score: null, einordnung: '', full_assessment: '',
      source: new URLSearchParams(window.location.search).get('source') || ''
    };

    // ── Init ───────────────────────────────────────────────────────────────────
    const INITIAL_MESSAGE = `I'll share three common perspectives from marketing and research. Tell me off the top of your head your thoughts for each one — and whether you act on it in your professional role or not.

"Effective communication must first capture attention, then persuade, and ideally evoke emotion."`;

    window.addEventListener('DOMContentLoaded', () => {
      conversationHistory.push({ role: 'assistant', content: INITIAL_MESSAGE });
      appendBubble(INITIAL_MESSAGE, 'ai');
      document.getElementById('input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
      });
    });

    // ── Helpers ────────────────────────────────────────────────────────────────
    function appendBubble(text, who) {
      const el = document.createElement('div');
      el.className = `bubble ${who}`;
      el.textContent = text;
      document.getElementById('messages').appendChild(el);
      scrollBottom();
      return el;
    }

    function showTyping() {
      const el = document.createElement('div');
      el.className = 'typing';
      el.id = 'typing';
      el.innerHTML = '<span></span><span></span><span></span>';
      document.getElementById('messages').appendChild(el);
      scrollBottom();
    }

    function removeTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    function scrollBottom() {
      const m = document.getElementById('messages');
      m.scrollTop = m.scrollHeight;
    }

    function setInputDisabled(disabled) {
      document.getElementById('input').disabled = disabled;
      document.getElementById('sendBtn').disabled = disabled;
    }

    // ── PHASE 1 – Send answer ──────────────────────────────────────────────────
    async function send() {
      if (phase !== 1) return;
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      setInputDisabled(true);
      appendBubble(text, 'user');

      questionIndex++;
      answers.push(text);
      conversationHistory.push({ role: 'user', content: text });

      showTyping();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationHistory, userMessage: text }),
        });
        const data = await res.json();
        removeTyping();

        const reply = data.reply || 'Got it.';
        conversationHistory.push({ role: 'assistant', content: reply });
        appendBubble(reply, 'ai');

        if (questionIndex >= 3) {
          phase = 3;
          setInputDisabled(true);
          generateAssessment();
        } else {
          setInputDisabled(false);
          document.getElementById('input').focus();
        }
      } catch {
        removeTyping();
        appendBubble('Connection error. Please try again.', 'ai');
        setInputDisabled(false);
      }
    }

    // ── PHASE 3 – Generate assessment ─────────────────────────────────────────
    async function generateAssessment() {
      document.getElementById('spinner').classList.add('active');

      try {
        const res = await fetch('/api/generate-assessment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            answer_1: answers[0],
            answer_2: answers[1],
            answer_3: answers[2],
          }),
        });
        const data = await res.json();

        leadData.score = data.score;
        leadData.einordnung = data.einordnung;
        leadData.full_assessment = data.full_assessment;

        document.getElementById('spinner').classList.remove('active');
        showScoreCard(data.score, data.einordnung);
        phase = 4;
        setTimeout(showEmailStep, 800);
      } catch {
        document.getElementById('spinner').classList.remove('active');
        appendBubble('Something went wrong generating your assessment. Please reload the page.', 'ai');
      }
    }

    function showScoreCard(score, einordnung) {
      const card = document.createElement('div');
      card.className = 'score-card';
      const scoreDisplay = score !== null ? `${score}/100` : '–/100';
      card.innerHTML = `
        <div class="score-num">${scoreDisplay}</div>
        <div class="score-label">${einordnung || 'Assessment complete'}</div>
      `;
      document.getElementById('messages').appendChild(card);
      scrollBottom();
    }

    // ── PHASE 4 – Email ────────────────────────────────────────────────────────
    function showEmailStep() {
      const score = leadData.score;
      let recommendation;

      if (score <= 24) {
        recommendation = `Your score suggests you're working primarily within classical marketing models — which is exactly where the IIEX talk will challenge your thinking most. The evidence from implicit research is hard to ignore once you've seen it.`;
      } else if (score <= 49) {
        recommendation = `Your score shows a solid foundation — and some real blind spots where Deep Implicit Research could sharpen your decisions. The IIEX talk is directly relevant to where you are right now.`;
      } else if (score <= 74) {
        recommendation = `You already recognize the limits of classical research. The IIEX talk will give you the frameworks and evidence to take that thinking further — and act on it.`;
      } else {
        recommendation = `You're already ahead of most practitioners in this space. The IIEX talk will validate what you suspect — and add the research backbone to make the case internally.`;
      }

      appendBubble(recommendation, 'ai');

      setTimeout(() => {
        appendBubble('Want me to send you the full assessment and the IIEX keynote slides?', 'ai');

        const form = document.createElement('div');
        form.className = 'inline-form';
        form.innerHTML = `
          <input type="email" id="emailInput" placeholder="Your email address" autocomplete="email" />
          <button onclick="submitEmail()">Send it to me</button>
          <span class="skip-link" onclick="skipEmail()">No thanks, the score is enough</span>
        `;
        document.getElementById('messages').appendChild(form);
        scrollBottom();
        document.getElementById('emailInput').focus();

        document.getElementById('emailInput').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') submitEmail();
        });
      }, 800);
    }

    async function submitEmail() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email || !email.includes('@')) {
        document.getElementById('emailInput').style.borderColor = '#ff4444';
        return;
      }

      const form = document.querySelector('.inline-form');
      if (form) form.remove();

      appendBubble(email, 'user');
      await saveLead(email);
      appendBubble('Thank you! You will receive the full assessment and slides shortly.', 'ai');
      phase = 5;
    }

    async function skipEmail() {
      const form = document.querySelector('.inline-form');
      if (form) form.remove();

      await saveLead(null);
      appendBubble('Thanks for your time!', 'ai');
      phase = 5;
    }

    // ── Save lead to Supabase ──────────────────────────────────────────────────
    async function saveLead(email) {
      try {
        await fetch('/api/save-lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: null,
            company: null,
            email: email || null,
            answer_1: answers[0],
            answer_2: answers[1],
            answer_3: answers[2],
            score: leadData.score,
            einordnung: leadData.einordnung,
            full_assessment: leadData.full_assessment,
            chat_history: conversationHistory,
            source: leadData.source || null,
          }),
        });
      } catch (err) {
        console.error('Failed to save lead:', err);
      }
    }
  </script>
</body>
</html>
